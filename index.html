<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#fff; min-height:100vh; padding:48px 32px 64px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header { max-width:1080px; margin:0 auto 32px; }
  h1 {
    color:#1a1a1a; font-size:22px; font-weight:600; letter-spacing:1px; margin-bottom:10px;
  }
  .sub { color:#9a9a9a; font-size:13px; letter-spacing:.5px; }
  .bar {
    max-width:1080px; margin:0 auto 28px; height:2px; background:#eeeeee; border-radius:2px; overflow:hidden;
  }
  .bar i { display:block; height:100%; width:0; background:#d42b2b; transition:width .3s ease; }
  .bar.done { opacity:0; transition:opacity .5s ease .3s; }
  .grid {
    max-width:1080px; margin:0 auto;
    display:grid; grid-template-columns:repeat(4,1fr); gap:24px;
  }
  .cell { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .frame {
    position:relative; width:100%; aspect-ratio:1/1; overflow:hidden;
    border-radius:12px; background:#f6f6f6;
  }
  .ph, .frame img {
    position:absolute; inset:0; width:100%; height:100%;
    background-size:contain; background-position:center; background-repeat:no-repeat;
    object-fit:contain;
  }
  .frame img { opacity:0; transition:opacity .35s ease; }
  .frame img.loaded { opacity:1; }
  .ph.hide { opacity:0; transition:opacity .35s ease; }
  .cell span {
    color:#9a9a9a; font-size:12px; letter-spacing:1px; transition:color .18s ease;
  }
  .cell:hover span { color:#333; }
  @media (max-width:860px) {
    body { padding:32px 20px 48px; }
    .grid { grid-template-columns:repeat(2,1fr); gap:16px; }
  }
</style>

<script>
  var CDN_VERSION = 'v=2';

  var imgs = Array.prototype.slice.call(document.querySelectorAll('.frame img'));
  var loaded = 0, total = imgs.length;
  var bar = document.getElementById('bar');
  var barFill = bar.querySelector('i');
  var statusEl = document.getElementById('status');

  function tick() {
    loaded++;
    barFill.style.width = (loaded * 100 / total) + '%';
    if (loaded >= total) {
      bar.classList.add('done');
      statusEl.textContent = '共 16 款 · 已全部加载';

  function load(el) {
    var primary = el.dataset.src.replace('CDNPLACEHOLDER', '') ;
    var node = new Image();
    node.onload = function () {
      el.src = node.src;
      el.classList.add('loaded');
      var p = el.parentNode.querySelector('.ph');
      if (p) p.classList.add('hide');
      tick();
    };
    node.onerror = function () {
      if (!node.__triedFallback) {
        node.__triedFallback = true;
        node.src = el.dataset.fallback;
      } else {
        tick();
      }
    };
    node.src = CDN + primary + '?' + CDN_VERSION;
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { load(e.target); io.unobserve(e.target); }
      });
    }, { rootMargin: '200px' });
    imgs.forEach(function (el) { io.observe(el); });
  } else {
    imgs.forEach(load);
